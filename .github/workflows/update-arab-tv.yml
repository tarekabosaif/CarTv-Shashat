name: Update Arab TV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate playlist
        run: node .github/scripts/generate-arab-tv.mjs

      - name: Check stream codecs
        run: node .github/scripts/check-streams.mjs

      - name: Commit playlist and compatibility report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlists/arab-tv.m3u playlists/compatibility-report.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update playlist and compatibility report"
            git push
          fi
