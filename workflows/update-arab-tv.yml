name: Update Arab TV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate playlist
        run: node .github/scripts/generate-arab-tv.mjs

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlists/arab-tv.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "chore: update Arab TV playlist"
            git push
          fi
